name: Build BlockBlastAutoBot.dylib (iOS arm64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-ios-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile BlockBlastAutoBot.dylib (Xcode iOS SDK)
        run: |
          mkdir -p build dist
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using Xcode iOS SDK at: $SDK_PATH"
          SRC_FILE="Tweak.m"
          if [ ! -f "$SRC_FILE" ]; then
            SRC_FILE="Tweak.mm"
          fi
          xcrun --sdk iphoneos clang -isysroot "$SDK_PATH" \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -mios-version-min=14.0 \
            -install_name @rpath/BlockBlastAutoBot.dylib \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            "$SRC_FILE" -o build/BlockBlastAutoBot.dylib
          codesign -f -s - build/BlockBlastAutoBot.dylib
          cp build/BlockBlastAutoBot.dylib dist/BlockBlastAutoBot.dylib
          ls -lh build/BlockBlastAutoBot.dylib

      - name: Upload Artifact BlockBlastAutoBot.dylib
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAutoBot-Dylib
          path: build/BlockBlastAutoBot.dylib

      - name: Publish Direct Download & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p dist
          cp build/BlockBlastAutoBot.dylib dist/BlockBlastAutoBot.dylib
          git add -f dist/BlockBlastAutoBot.dylib
          git diff --staged --quiet || (git commit -m "chore: output BlockBlastAutoBot.dylib [skip ci]" && git push origin HEAD:main) || true
          gh release create "v1.0.${{ github.run_number }}" build/BlockBlastAutoBot.dylib \
            --title "BlockBlastAutoBot.dylib (Bản build #${{ github.run_number }})" \
            --notes "Nhấn vào file BlockBlastAutoBot.dylib bên dưới để tải trực tiếp về iPhone và chèn vào IPA qua mục Thêm thư viện (Inject Dylib) trong ESign hoặc Feather." || true
